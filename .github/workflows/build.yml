
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout original source
        uses: actions/checkout@v4
        with:
          repository: Bytecode745/Violation-Reader
          ref: main

      - name: Check project files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.sln

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild Violations.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Violation-Reader-Windows
          path: |
            **/Release/*.exe
            **/Release/**/*.exe
          if-no-files-found: error
